# 手动触发专用：只构建 Windows x64 客户端，产物保存为 Actions artifact。
name: Build Windows package (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，将写入 Windows 安装包
        required: true
        default: "1.0.18"
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"
  WAILS_VERSION: "v2.13.0"

jobs:
  build-windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup uv and WiX packaging tools
        shell: pwsh
        run: |
          pipx install uv==0.8.14
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 4.0.5
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add WixToolset.Bal.wixext/4.0.5
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add WixToolset.Util.wixext/4.0.5
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Release Module contract tests
        run: uv run -m unittest scripts.tests.test_release
      - name: Build Windows package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: uv run scripts/release.py build --target windows-amd64 --version "$env:PACKAGE_VERSION"
      - name: Verify same-version installer upgrade
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/release/windows-amd64/out -Filter *-setup.exe -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer" }
          uv run scripts/tests/windows_installer_upgrade.py --installer $installers[0].FullName --payload build/release/windows-amd64/stage/TunnelBoard --version "$env:PACKAGE_VERSION"
      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnelboard-windows-installer-logs-${{ github.run_id }}
          path: build/release/windows-amd64/installer-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload exact Windows candidate directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnelboard-windows-${{ github.run_id }}
          path: build/release/windows-amd64/out
          if-no-files-found: error
          retention-days: 14
