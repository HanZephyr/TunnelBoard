# 手动触发专用：只构建 macOS universal 安装包（DMG + bundle + manifest + SHA256SUMS）。
# 必须在 macos runner 上执行（lipo/codesign/hdiutil 与 Wails darwin 构建需要 macOS SDK）。
# 用法：Actions 页 → "Build macOS package (manual)" → Run workflow，输入版本号。

name: Build macOS package (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，将写入 macOS 安装包
        required: true
        default: "1.0.18"
        type: string

# 只读权限即可；构建产物经 upload-artifact 取回，不写 Release。
permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"
  WAILS_VERSION: "v2.13.0"

jobs:
  build-macos-package:
    runs-on: macos-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup uv and Wails
        run: |
          pipx install uv==0.8.14
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build macOS package
        run: uv run scripts/release.py build --target darwin-universal --version "${{ inputs.version }}"
      - name: Upload exact macOS candidate directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnelboard-macos-${{ github.run_id }}
          path: build/release/darwin-universal/out
          if-no-files-found: error
          retention-days: 14
