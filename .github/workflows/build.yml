name: Build and release

on:
  push:
    branches: [main, master, "release/*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 默认只读；仅 draft-release job 提升 contents 权限。
permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"
  WAILS_VERSION: "v2.13.0"

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup uv
        run: pipx install uv==0.8.14
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Generate Wails bindings from current Go source
        run: wails build -clean -platform windows/amd64
      - name: Frontend production build
        run: pnpm run build
        working-directory: frontend
      - name: Release Module contract tests
        run: uv run -m unittest scripts.tests.test_release -v

  build-windows:
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup uv and packaging tools
        shell: pwsh
        run: |
          pipx install uv==0.8.14
          choco install nsis --version=3.11 -y --no-progress
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build unsigned CI candidate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: uv run scripts/release.py build --target windows-amd64 --version "0.0.0-ci.${{ github.run_number }}"
      - name: Build signed Tag candidate
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          TUNNELBOARD_SIGN_CERT_BASE64: ${{ secrets.TUNNELBOARD_SIGN_CERT_BASE64 }}
          TUNNELBOARD_SIGN_CERT_PASSWORD: ${{ secrets.TUNNELBOARD_SIGN_CERT_PASSWORD }}
        run: uv run scripts/release.py build --target windows-amd64 --version "${{ github.ref_name }}" --require-signing
      - name: Upload exact Windows candidate directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnelboard-windows-${{ github.run_id }}
          path: build/release/windows-amd64/out
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup uv and Wails
        run: |
          pipx install uv==0.8.14
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build macOS conditional candidate
        run: uv run scripts/release.py build --target darwin-universal --version "0.0.0-ci.${{ github.run_number }}"
      - name: Upload exact macOS candidate directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnelboard-macos-${{ github.run_id }}
          path: build/release/darwin-universal/out
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: [build-windows, build-macos]
    runs-on: windows-latest
    steps:
      - name: Checkout verifier from the same commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup uv
        shell: pwsh
        run: pipx install uv==0.8.14
      - name: Download Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tunnelboard-windows-${{ github.run_id }}
          path: artifacts/windows
      - name: Download macOS candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tunnelboard-macos-${{ github.run_id }}
          path: artifacts/macos
      - name: Verify re-downloaded Windows bundle and AF_UNIX POC
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem artifacts/windows -Filter *.bundle.zip -Recurse -File -ErrorAction Stop)
          if ($bundles.Count -ne 1) { throw "Expected exactly one Windows bundle, found $($bundles.Count)" }
          $bundle = $bundles[0].FullName
          uv run scripts/release.py verify --artifact $bundle --execute-caddy
      - name: Verify unsigned branch installer lifecycle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/windows -Filter *-setup.exe -Recurse -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $installer = $installers[0].FullName
          uv run scripts/release.py verify-windows-installer --installer $installer
      - name: Verify signed Tag installer lifecycle
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/windows -Filter *-setup.exe -Recurse -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $installer = $installers[0].FullName
          uv run scripts/release.py verify-windows-installer --installer $installer --require-signing
      - name: Verify re-downloaded macOS bundle structure
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem artifacts/macos -Filter *.bundle.zip -Recurse -File -ErrorAction Stop)
          if ($bundles.Count -ne 1) { throw "Expected exactly one macOS bundle, found $($bundles.Count)" }
          $bundle = $bundles[0].FullName
          uv run scripts/release.py verify --artifact $bundle

  draft-release:
    needs: verify-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tunnelboard-windows-${{ github.run_id }}
          path: artifacts/windows
      - name: Create draft Release for real-machine UAC acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/windows/*-setup.exe \
            artifacts/windows/*.manifest.json \
            artifacts/windows/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "TunnelBoard ${GITHUB_REF_NAME}" \
            --notes $'Windows x64 candidate. Publish only after the downloaded installer passes the real desktop UAC smoke.\n\nmacOS: withheld pending amd64/arm64 privileged real-machine validation.\nLinux: not delivered for this MVP.'
